name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version in VERSION: ${VERSION}" >&2
            exit 1
          fi

          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match VERSION (${VERSION})." >&2
            exit 1
          fi

          if ! grep -Eq "^## \\[${VERSION//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for ${VERSION}." >&2
            exit 1
          fi

          awk -v version="${VERSION}" '
            index($0, "## [" version "] - ") == 1 {
              found = 1
              next
            }
            found && (/^## \[/ || /^\[/) { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "Release notes for ${VERSION} are empty." >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          RELEASE_ARGS=(
            "v${VERSION}"
            --verify-tag
            --title "NixOS Lab v${VERSION}"
            --notes-file release-notes.md
          )

          if [[ "${VERSION}" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--latest)
          fi

          gh release create "${RELEASE_ARGS[@]}"
