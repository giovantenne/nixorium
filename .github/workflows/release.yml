name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-validation:
    name: Validate complete release
    runs-on: ubuntu-24.04
    # GitHub-hosted jobs cannot exceed six hours.
    timeout-minutes: 360
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version in VERSION: ${VERSION}" >&2
            exit 1
          fi

          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match VERSION (${VERSION})." >&2
            exit 1
          fi

          INSTALLER_RELEASE="$(sed -n 's/^DEFAULT_RELEASE="\(v[^\"]*\)"$/\1/p' install.sh)"
          if [[ "${INSTALLER_RELEASE}" != "${TAG}" ]]; then
            echo "install.sh defaults to ${INSTALLER_RELEASE}, expected ${TAG}." >&2
            exit 1
          fi

          TEMPLATE_RELEASE="$(sed -n 's/^  inputs\.nixorium\.url = "github:giovantenne\/nixorium\/\([^"]*\)";$/\1/p' templates/site/flake.nix)"
          if [[ "${TEMPLATE_RELEASE}" != "${TAG}" ]]; then
            echo "Site template pins ${TEMPLATE_RELEASE}, expected ${TAG}." >&2
            exit 1
          fi

          if ! grep -Eq "^## \\[${VERSION//./\\.}\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for ${VERSION}." >&2
            exit 1
          fi

          awk -v version="${VERSION}" '
            index($0, "## [" version "] - ") == 1 {
              found = 1
              next
            }
            found && (/^## \[/ || /^\[/) { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "Release notes for ${VERSION} are empty." >&2
            exit 1
          fi

      - name: Reclaim unused hosted-runner SDK space
        shell: bash
        run: |
          set -euo pipefail
          # Only preinstalled SDKs on this disposable runner; never the Nix store.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install Nix with KVM support
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            max-jobs = 1
            cores = 2
            timeout = 0
            max-silent-time = 0

      - name: Check VM prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          free -h
          df -h /nix/store

      - name: Run complete release validation
        shell: bash
        env:
          NIX_CONFIG: print-build-logs = true
        run: |
          set -euo pipefail
          ./scripts/validate.sh --full 2>&1 | tee "$RUNNER_TEMP/release-validation.log"

      - name: Preserve validation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-validation.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Store validated release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish GitHub release
    needs: full-validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download validated release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          git fetch --no-tags origin "refs/tags/v${VERSION}"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]]; then
            echo "Release tag no longer points to the validated commit." >&2
            exit 1
          fi
          RELEASE_ARGS=(
            "v${VERSION}"
            --verify-tag
            --title "Nixorium v${VERSION}"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )

          if [[ "${VERSION}" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--latest)
          fi

          gh release create "${RELEASE_ARGS[@]}"
